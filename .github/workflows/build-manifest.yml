name: Build Exercises Manifest

on:
  push:
    branches: [main]
    paths:
      - "exercises/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const baseDir = "exercises";
            const manifest = {};

            if (fs.existsSync(baseDir)) {
              const people = fs.readdirSync(baseDir).filter(p =>
                fs.statSync(path.join(baseDir, p)).isDirectory()
              );

              for (const person of people) {
                const personDir = path.join(baseDir, person);
                const files = fs.readdirSync(personDir)
                  .filter(f => f.endsWith(".js"))
                  .sort();
                manifest[person] = files.map(f => f.replace(/\.js$/, ""));
              }
            }

            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2));
            console.log("manifest.json generated:", JSON.stringify(manifest, null, 2));
          '

      - name: Commit and push manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "هیچ تغییری در manifest.json نیست"
          else
            git commit -m "chore: update manifest.json [skip ci]"
            git push
          fi
